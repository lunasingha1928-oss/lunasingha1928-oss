<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#2E0404"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="14%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <rect width="1200" height="280" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="5s" repeatCount="indefinite"/>
  </rect>

  <rect x="6" y="6" width="1188" height="268" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.45"/>

  <rect x="6" y="6" width="1188" height="268" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.9" stroke-dasharray="60 2860" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-2920" dur="11s" repeatCount="indefinite"/>
  </rect>

  <g fill="#8B0000">
    <circle cx="700" cy="260" r="2.2" opacity="0">
      <animate attributeName="cy" values="260;40" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="260" r="1.6" opacity="0" fill="#D4AF37">
      <animate attributeName="cy" values="260;30" dur="8.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="8.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="260" r="2" opacity="0">
      <animate attributeName="cy" values="260;35" dur="6.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="260" r="1.8" opacity="0" fill="#D4AF37">
      <animate attributeName="cy" values="260;45" dur="9s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="260" r="1.5" opacity="0">
      <animate attributeName="cy" values="260;50" dur="7.5s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="7.5s" begin="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(150,140)">
    <circle r="82" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.55"/>

    <circle r="96" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 7" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#D4AF37" stroke-width="1.5" opacity="0.5">
      <line x1="0" y1="-82" x2="0" y2="-70"/>
      <line x1="0" y1="82" x2="0" y2="70"/>
      <line x1="-82" y1="0" x2="-70" y2="0"/>
      <line x1="82" y1="0" x2="70" y2="0"/>
    </g>

    <path d="M -8 -60 Q 50 -55 55 -5 T 5 65 Q -45 70 -60 20" fill="none" stroke="#8B0000" stroke-width="1.1" opacity="0.55" stroke-dasharray="6 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="6s" repeatCount="indefinite"/>
    </path>

    <line x1="0" y1="0" x2="0" y2="-48" stroke="#D4AF37" stroke-width="2.2">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="14s" repeatCount="indefinite"/>
    </line>

    <line x1="0" y1="0" x2="38" y2="18" stroke="#8B0000" stroke-width="2.2">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="9s" repeatCount="indefinite"/>
    </line>

    <circle r="4" fill="#D4AF37">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="320" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#D4AF37" font-weight="bold">LUNA
    <animate attributeName="fill" values="#D4AF37;#F4D976;#D4AF37" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="323" y="168" font-family="Georgia, serif" font-size="16" fill="#E8C766" letter-spacing="3">AI / ML &#183; REMOTE SENSING &#183; SYSTEMS
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" begin="1s" repeatCount="indefinite"/>
  </text>
  <line x1="323" y1="182" x2="880" y2="182" stroke="#8B0000" stroke-width="1" opacity="0.65" stroke-dasharray="5 5">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
